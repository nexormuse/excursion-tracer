<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>excursion-tracer</title>
<meta name="description" content="수율 이상 원인 설비 역추적 LLM 에이전트와 가상 팹 평가 환경: 결과와 추적 기록">
<style>
  :root {
    color-scheme: light;
    --bg: #f6f8fa; --panel: #ffffff; --ink: #1f2328; --ink2: #59636e; --line: #d0d7de;
    --line2: #d8dee4; --code: #eff1f3; --zebra: #f6f8fa; --link: #0969da; --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0d1117; --panel: #151b23; --ink: #e6edf3; --ink2: #9198a1; --line: #3d444d;
      --line2: #3d444d; --code: #262c36; --zebra: #1b222c; --link: #4493f8; --accent: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.6 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 1; background: var(--panel);
           border-bottom: 1px solid var(--line); }
  .bar { max-width: 1060px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap;
         gap: 6px 18px; align-items: center; }
  .brand { font-weight: 600; color: var(--ink); text-decoration: none; margin-right: auto; }
  nav { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
  nav a { color: var(--ink2); text-decoration: none; padding: 2px 0; border-bottom: 2px solid transparent; }
  nav a.active { color: var(--ink); border-bottom-color: var(--accent); }
  main { max-width: 1060px; margin: 20px auto 40px; padding: 28px clamp(16px, 4vw, 40px);
         background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .wrap { padding: 0 16px; }
  h1, h2 { border-bottom: 1px solid var(--line2); padding-bottom: .3em; }
  a { color: var(--link); }
  table { border-collapse: collapse; display: block; overflow-x: auto; margin: 16px 0; max-width: 100%; }
  th, td { border: 1px solid var(--line); padding: 6px 12px; vertical-align: top; }
  tr:nth-child(2n) td { background: var(--zebra); }
  code { background: var(--code); padding: .15em .4em; border-radius: 6px; font-size: 85%; }
  pre { background: var(--code); padding: 14px 16px; overflow-x: auto; border-radius: 6px; line-height: 1.45; }
  pre code { background: none; padding: 0; }
  img { max-width: 100%; height: auto; background: #fcfcfb; border-radius: 4px; }
  footer { max-width: 1060px; margin: 0 auto 32px; padding: 0 16px; color: var(--ink2); font-size: 13px; }
  .err { color: #cf222e; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="#/README.md">excursion-tracer</a>
    <nav id="nav">
      <a href="#/README.md">개요와 결과</a>
      <a href="#/results/traces/README.md">추적 기록</a>
      <a href="#/results/traces/scn_5029.md">성공 사례</a>
      <a href="#/results/traces/scn_5002.md">실패 사례</a>
      <a href="#/results/traces/scn_5003.md">F5 사례</a>
      <a href="#/results/failure_analysis.md">실패 사례 분석</a>
      <a href="https://github.com/nexormuse/excursion-tracer">GitHub</a>
    </nav>
  </div>
</header>
<div class="wrap"><main id="content">불러오는 중…</main></div>
<footer>
  원자료: <a href="results/summary.json">summary.json</a> ·
  <a href="results/per_scenario.csv">per_scenario.csv</a> ·
  코드: <a href="https://github.com/nexormuse/excursion-tracer">github.com/nexormuse/excursion-tracer</a>
</footer>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  const REPO = "https://github.com/nexormuse/excursion-tracer/blob/main/";
  const main = document.getElementById("content");

  function current() {
    const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    return /^[\w./-]+\.md$/.test(h) && !h.includes("..") ? h : "README.md";
  }

  function dirOf(path) {
    const i = path.lastIndexOf("/");
    return i < 0 ? "" : path.slice(0, i + 1);
  }

  function resolve(base, rel) {
    const parts = (dirOf(base) + rel).split("/");
    const out = [];
    for (const p of parts) {
      if (p === "..") out.pop();
      else if (p !== "." && p !== "") out.push(p);
    }
    return out.join("/");
  }

  function fixLinks(path) {
    main.querySelectorAll("img[src]").forEach(img => {
      const src = img.getAttribute("src");
      if (!/^(https?:|data:|\/)/.test(src)) img.src = resolve(path, src);
      img.loading = "lazy";
    });
    main.querySelectorAll("a[href]").forEach(a => {
      const href = a.getAttribute("href");
      if (/^(https?:|mailto:|#)/.test(href)) return;
      const target = resolve(path, href);
      if (target.endsWith(".md")) a.setAttribute("href", "#/" + target);
      else if (/^(results\/|README)/.test(target)) a.setAttribute("href", target);
      else a.setAttribute("href", REPO + target);
    });
  }

  function markNav(path) {
    document.querySelectorAll("#nav a").forEach(a => {
      a.classList.toggle("active", a.getAttribute("href") === "#/" + path);
    });
  }

  async function show() {
    const path = current();
    markNav(path);
    try {
      const res = await fetch(path, { cache: "no-store" });
      if (!res.ok) throw new Error(res.status + " " + path);
      const md = await res.text();
      if (window.marked) {
        main.innerHTML = marked.parse(md);
      } else {
        const pre = document.createElement("pre");
        pre.textContent = md;
        main.replaceChildren(pre);
      }
      fixLinks(path);
      const h1 = main.querySelector("h1");
      document.title = h1 && path !== "README.md" ? h1.textContent + " · excursion-tracer" : "excursion-tracer";
      window.scrollTo(0, 0);
    } catch (e) {
      main.innerHTML = "";
      const p = document.createElement("p");
      p.className = "err";
      p.textContent = "문서를 불러오지 못했습니다: " + e.message;
      main.appendChild(p);
    }
  }

  window.addEventListener("hashchange", show);
  show();
})();
</script>
</body>
</html>
